name: Build

on:
  push:
    branches: [ "1.16" ]
  pull_request:
    branches: [ "1.16" ]


jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JVM_OPTS: -Xmx3200m
      _JAVA_OPTIONS: -Xmx3200m
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Minecraft development environment
        run: |
          ./gradlew downloadAssets
          ./gradlew extractMcpData
          ./gradlew extractSrg

      - name: Gradle Build (skip tests due to mixin issues)
        run: ./gradlew build -x test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-artifacts
          path: build/libs/
